[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:python-install]
command=bash -c "rm -f /tmp/python-ready && uv sync && touch /tmp/python-ready"
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
priority=5
autostart=true
startsecs=0

[program:api]
command=bash -c "while [ ! -f /tmp/python-ready ]; do sleep 1; done; exec uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port 5055"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10
autostart=true

[program:worker]
command=bash -c "while [ ! -f /tmp/python-ready ]; do sleep 1; done; exec uv run --no-sync surreal-commands-worker --import-modules commands"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
autostart=true
startsecs=3

[program:frontend]
command=bash -c "/app/scripts/wait-for-api.sh && node node_modules/next/dist/bin/next start -p 8502"
directory=/opt/frontend
environment=NODE_ENV="production"
passenv=API_URL,NEXT_PUBLIC_API_URL,PORT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30
autostart=true

[program:ssl-setup]
command=bash -c "/app/generate-ssl.sh"
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
priority=35
autostart=true
startsecs=0

[program:nginx]
command=/app/scripts/start-nginx.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=40
autostart=true
